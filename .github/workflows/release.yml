name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 主进程依赖（electron 等 devDeps）；跳过二进制下载脚本，打包步骤再按需下载
      - name: Install root deps
        run: npm install --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Install renderer deps
        run: npm install
        working-directory: renderer

      - name: Typecheck main
        run: npm run typecheck:main

      - name: Build main
        run: npm run build:main

      - name: Typecheck renderer
        run: npm run typecheck
        working-directory: renderer

      - name: Build renderer (static export)
        run: npm run build
        working-directory: renderer

      # 便携目录（dir target）是 CI 已验证的稳妥路径，先产出保底
      - name: Package portable (dir)
        run: npx electron-builder --win dir
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '0'

      # 打成单文件 zip：下载解压双击 maskdesk.exe 即用
      - name: Zip portable
        shell: pwsh
        run: Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath "maskdesk-win-portable.zip" -Force

      # NSIS 安装包：electron-builder 25.x 在 windows CI 偶发 makensis.exe ENOENT（#8613），
      # 标记 best-effort，失败不阻塞便携包发布
      - name: Package NSIS installer (best-effort)
        run: npx electron-builder --win nsis
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '0'
        continue-on-error: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            maskdesk-win-portable.zip
            dist/*.exe
          generate_release_notes: true
